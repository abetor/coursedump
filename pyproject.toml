[project]
readme = "README.md"
license = {file = "LICENSE"}
keywords = ["python", "cli", "markdown", "document-conversion", "transcription", "speech-recognition", "knowledge-management"]
name = "coursedump"
version = "0.1.0"
description = "Turn authorized course sources into resumable Markdown snapshots"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "yt-dlp>=2025.1.1",
    "mlx-whisper>=0.4; platform_machine == 'arm64' and sys_platform == 'darwin'",
    "pymupdf4llm>=0.0.17",
    "markitdown[docx,pptx,xlsx]>=0.1",
]

[project.optional-dependencies]
fwhisper = ["faster-whisper>=1.0"]

[project.scripts]
coursedump = "coursedump.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["coursedump"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.urls]
Repository = "https://github.com/abetor/coursedump"
Documentation = "https://github.com/abetor/coursedump#readme"
Issues = "https://github.com/abetor/coursedump/issues"
